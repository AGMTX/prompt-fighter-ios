workflows:
  ios-workflow:
    name: Prompt Fighter - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # This name must match the App Store Connect API key you add under
      # Codemagic > Teams > Integrations > Apple Developer Portal.
      app_store_connect: codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.austinwg04.promptfighter
      vars:
        BUNDLE_ID: "com.austinwg04.promptfighter"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Numeric Apple ID of the app record in App Store Connect
        # (fill this in once you've created the app record - see README.md).
        APP_STORE_APPLE_ID: 6815818969
      node: latest
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Add iOS platform (first run only)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync web assets into the native project
        script: |
          npx cap sync ios

      - name: Set the app's display name, icon-friendly bundle id
        script: |
          cd ios/App
          # Bundle id / display name are already set by capacitor.config.json,
          # but keep this here in case you rename things later.
          agvtool new-marketing-version 1.0

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Set the build number from App Store Connect
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-build-number --app-id "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Uploads every successful build straight to TestFlight so you can
      # install it on your own iPhone/iPad before submitting for review.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip this to true only when you're ready to send it to App Review.
        submit_to_app_store: false
