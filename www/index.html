<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prompt Fighter</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="description" content="A robot-vs-monster game where kids learn three real AI prompting skills.">
<meta name="theme-color" content="#0A0424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prompt Fighter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --bg:#0A0424; --glass:#1B0E55; --glass2:#2A1783; --line:#4B33C9;
  --blue:#22D3FF; --purple:#B57BFF; --violet:#7B3DFF; --green:#39FF88;
  --yellow:#FFE44D; --red:#FF3D5A; --pink:#FF4FD8; --navy:#0A0424;
  --text:#F4F0FF; --muted:#B9ADF2;
  --disp:'Lilita One','Fredoka',system-ui,sans-serif;
  --arc:'Bungee','Lilita One',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font:700 16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 520px at 50% -8%,rgba(123,61,255,.6),transparent 65%),
  radial-gradient(700px 420px at 100% 105%,rgba(34,211,255,.28),transparent 60%),
  radial-gradient(600px 380px at 0% 100%,rgba(255,79,216,.22),transparent 60%),
  linear-gradient(rgba(34,211,255,.08) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,rgba(34,211,255,.08) 1px,transparent 1px) 0 0/44px 44px,
  var(--bg)}
button{font-family:var(--body);color:inherit}
:focus-visible{outline:4px solid var(--green);outline-offset:3px}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:none}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:28px}

/* ---------- buttons ---------- */
.btn{font:900 16px/1 var(--body);color:var(--text);background:linear-gradient(#3F26B5,#26127A);border:3px solid var(--blue);border-radius:16px;padding:12px 16px;box-shadow:0 5px 0 #0C0640,0 0 16px rgba(34,211,255,.35);cursor:pointer;transition:transform .08s,box-shadow .15s,filter .15s;touch-action:manipulation}
.btn:hover:not(:disabled){filter:brightness(1.25);box-shadow:0 5px 0 #0C0640,0 0 26px rgba(34,211,255,.8)}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 #0C0640,0 0 14px rgba(34,211,255,.6)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{color:var(--navy);background:linear-gradient(#9CFFC4,#2BE377);border-color:#D6FFE6;box-shadow:0 5px 0 #0E7A3D,0 0 22px rgba(57,255,136,.55)}
.btn.go:hover:not(:disabled){box-shadow:0 5px 0 #0E7A3D,0 0 34px rgba(57,255,136,.95)}
.btn.go:active:not(:disabled){box-shadow:0 0 0 #0E7A3D,0 0 16px rgba(57,255,136,.6)}
.btn.hot{color:#fff;background:linear-gradient(#FF7BE6,#DC26BB);border-color:#FFC7F5;box-shadow:0 5px 0 #86106F,0 0 22px rgba(255,79,216,.6)}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:14px}
.btn.big{font:400 26px/1 var(--disp);padding:16px 32px;border-radius:22px;letter-spacing:.03em}

/* ---------- title ---------- */
.title-hero{text-align:center;padding-top:10px}
.logo{font-family:var(--arc);font-weight:400;line-height:.98;margin:0;color:#fff;font-size:clamp(44px,12.5vw,104px);letter-spacing:.02em;text-wrap:balance;
  text-shadow:0 0 6px #fff,0 0 16px var(--blue),0 0 34px var(--violet),0 0 64px var(--violet);animation:neon 3.4s ease-in-out infinite}
.logo-sub{display:inline-block;margin-top:18px;padding:8px 18px;border:3px solid var(--green);border-radius:14px;color:var(--green);font:400 clamp(14px,4.2vw,26px)/1.1 var(--arc);letter-spacing:.08em;
  text-shadow:0 0 10px var(--green);box-shadow:0 0 18px rgba(57,255,136,.55),inset 0 0 14px rgba(57,255,136,.3);transform:rotate(-2deg);animation:flicker 4s steps(1) infinite}
.cast{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,4vw,34px);margin:26px 0 12px;padding-bottom:12px}
.cast::after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:8px;border-radius:50%;background:radial-gradient(ellipse,rgba(34,211,255,.9),transparent 70%);filter:blur(3px)}
.cast .m{font-size:clamp(46px,12vw,84px);line-height:1;transform-origin:50% 100%;animation:squash 1.2s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(181,123,255,.7))}
.cast .m:nth-child(1){animation-delay:-.4s}.cast .m:nth-child(3){animation-delay:-.8s}
.cast .r{height:clamp(110px,28vw,170px);filter:drop-shadow(0 0 16px rgba(34,211,255,.7))}
.cast .r svg{height:100%;width:auto;display:block;transform-origin:50% 100%;animation:squash 1.1s ease-in-out infinite}
.lead{max-width:56ch;margin:14px auto 22px;font-size:clamp(17px,3.6vw,20px);font-weight:800;text-wrap:pretty}
.lead b{color:var(--navy);background:var(--green);border-radius:8px;padding:1px 8px;white-space:nowrap;box-shadow:0 0 14px rgba(57,255,136,.6)}
.sec-h{font:400 clamp(24px,5vw,32px)/1.1 var(--disp);margin:34px 0 12px;letter-spacing:.03em;color:#fff;text-shadow:0 0 14px var(--violet)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.step{background:linear-gradient(#1F1170,#150A4C);border:3px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 0 18px rgba(123,61,255,.35);display:flex;gap:12px;align-items:flex-start}
.step .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--green);color:var(--navy);display:grid;place-items:center;font:400 18px/1 var(--arc);box-shadow:0 0 14px rgba(57,255,136,.7)}
.step p{margin:0;font-weight:900}
.step small{display:block;font-weight:700;color:var(--muted);margin-top:2px}

/* ---------- level select ---------- */
.sel-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:6px}
.sel-head .sec-h{margin:0;flex:1}
.sel-sub{margin:8px 0 4px;font-weight:800;max-width:60ch;color:var(--muted)}
.lc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;margin-top:14px}
.lc{display:flex;flex-direction:column;background:linear-gradient(#1F1170,#120A40);border:3px solid var(--nc);border-radius:26px;box-shadow:0 0 22px var(--nc),0 6px 0 #05021A;overflow:hidden}
.lc-top{position:relative;height:160px;display:grid;place-items:center;background:linear-gradient(var(--s1),var(--s2));border-bottom:3px solid var(--nc)}
.lc-top .em{font-size:88px;line-height:1;transform-origin:50% 100%;animation:squash 1.4s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,255,255,.5))}
.lc-n{position:absolute;top:12px;left:12px;white-space:nowrap;background:var(--navy);color:var(--yellow);font:400 13px/1 var(--arc);letter-spacing:.06em;padding:6px 11px;border-radius:999px;border:2px solid var(--yellow)}
.lc-lock{position:absolute;top:10px;right:12px;font-size:26px}
.lc.locked{border-color:#4A3D8F;box-shadow:0 6px 0 #05021A}
.lc.locked .em{filter:grayscale(1);opacity:.3;animation:none}
.lc-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.lc-body h3{margin:0;font:400 28px/1.05 var(--disp);letter-spacing:.02em}
.pill{align-self:flex-start;background:var(--yellow);color:var(--navy);border-radius:999px;padding:3px 12px;font:900 12px/1.4 var(--body);letter-spacing:.07em;text-transform:uppercase}
.lc-body p{margin:0;text-wrap:pretty}
.lc-body .ai{background:rgba(123,61,255,.28);border:2px solid var(--purple);border-radius:14px;padding:8px 11px;font-weight:800;font-size:15px}
.lc-body .ai b{display:block;font:900 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.lc-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
.lc-foot .btn{flex:1;font:400 22px/1 var(--disp);padding:13px}
.stars-sm{font-size:20px;letter-spacing:2px;white-space:nowrap}
.star.off{filter:grayscale(1);opacity:.3}

/* ---------- battle ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding-bottom:12px;background:linear-gradient(var(--bg) 82%,transparent)}
.bar{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.bar .lvl{flex:1;min-width:0;line-height:1.1}
.bar .lvl span,.bar .lvl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .lvl b{display:block}
.bar .lvl span{display:block;font:900 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.bar .lvl b{font:400 clamp(18px,4.6vw,24px)/1.1 var(--disp);letter-spacing:.03em;color:#fff;text-shadow:0 0 12px var(--violet)}
.arena{position:relative;display:flex;flex-direction:column;height:clamp(190px,29vh,310px);border:3px solid var(--nc);border-radius:26px;box-shadow:0 0 26px var(--nc),inset 0 0 40px rgba(0,0,0,.4);overflow:hidden;background:linear-gradient(var(--s1),var(--s2))}
.arena::after{content:"";position:absolute;inset:0;pointer-events:none;animation:twinkle 3.2s ease-in-out infinite;background-image:
  radial-gradient(2px 2px at 12% 22%,#fff,transparent),radial-gradient(2px 2px at 34% 64%,#fff,transparent),
  radial-gradient(3px 3px at 60% 18%,#9FFBFF,transparent),radial-gradient(2px 2px at 82% 42%,#fff,transparent),
  radial-gradient(2px 2px at 93% 72%,#FFB6F3,transparent),radial-gradient(2px 2px at 48% 40%,#fff,transparent),
  radial-gradient(3px 3px at 22% 50%,#FFF3A3,transparent)}
.deco{position:absolute;left:50%;top:58px;transform:translateX(-50%);font-size:34px;line-height:1;animation:bob 3.4s ease-in-out infinite;z-index:1;filter:drop-shadow(0 0 10px var(--nc))}
.hud{position:relative;z-index:3;display:flex;justify-content:space-between;gap:10px;padding:9px 10px 0}
.hp{flex:0 1 46%;min-width:0;background:rgba(10,4,36,.82);border:2.5px solid var(--nc);border-radius:14px;padding:5px 9px 7px;box-shadow:0 0 12px rgba(0,0,0,.4)}
.hp-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font:400 15px/1.1 var(--disp);letter-spacing:.02em;white-space:nowrap}
.hp-top .hp-name{overflow:hidden;text-overflow:ellipsis}
.hp-num{font:400 13px/1 var(--arc);font-variant-numeric:tabular-nums;color:var(--yellow)}
.track{position:relative;height:15px;margin-top:4px;border:2px solid #6C55F5;border-radius:999px;background:#05021A;overflow:hidden}
.track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(5,2,26,.6) 9px 11px)}
.fill{height:100%;width:100%;background:linear-gradient(#9CFFC4,#1FE06B);box-shadow:0 0 12px rgba(57,255,136,.9);border-radius:999px;transition:width .7s cubic-bezier(.3,1.2,.4,1),background .3s}
.fill.mid{background:linear-gradient(#FFF3A3,#FFC400);box-shadow:0 0 12px rgba(255,228,77,.9)}
.fill.low{background:linear-gradient(#FF9AAA,#FF2B4E);box-shadow:0 0 12px rgba(255,61,90,.9)}
.stage{position:relative;flex:1;min-height:0;container-type:size;z-index:2}
.ground{position:absolute;left:0;right:0;bottom:0;height:22%;border-top:3px solid var(--nc);box-shadow:0 -3px 20px var(--nc);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 2px,transparent 2px 30px),repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 2px,transparent 2px 16px),linear-gradient(var(--g),#0A0630)}
.hero{position:absolute;left:9%;bottom:9%;height:80%;height:min(80%,46cqw);z-index:2}
.hero svg{height:100%;width:auto;display:block;transform-origin:50% 100%;animation:squash 1.15s ease-in-out infinite;overflow:visible;filter:drop-shadow(0 0 10px rgba(34,211,255,.55))}
.hero .m-sad{display:none}.hero.sad .m-sad{display:block}.hero.sad .m-happy{display:none}
.hero .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.hero .ant{transform-box:fill-box;transform-origin:50% 100%;animation:wig .8s ease-in-out infinite}
.hero .core{animation:core 1s ease-in-out infinite}
.sh{position:absolute;left:50%;bottom:-3%;width:70%;height:9px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(2px);animation:shadowbob 1.15s ease-in-out infinite;pointer-events:none}
.foe .sh{width:62%;animation-duration:1.2s}
.costume{position:absolute;left:50%;top:-14%;font-size:34px;font-size:clamp(28px,20cqh,44px);line-height:1;transform:translateX(-50%);animation:costume .5s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 0 8px var(--yellow));z-index:3}
.foe{position:absolute;right:9%;bottom:8%;height:80%;height:min(80%,44cqw);aspect-ratio:1;display:grid;place-items:center;z-index:2}
.foe .aura{position:absolute;width:92%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--aura) 0,transparent 68%);opacity:.85;animation:aura 2.4s ease-in-out infinite}
.foe-emo{position:relative;font-size:clamp(56px,13vh,110px);font-size:min(62cqh,32cqw,140px);line-height:1;transform-origin:50% 100%;filter:drop-shadow(0 0 12px var(--aura));transition:filter .8s;animation:squash 1s ease-in-out infinite}
.foe-emo.f-float{animation:floaty 3s ease-in-out infinite}
.foe-emo.f-hop{animation:squash .85s ease-in-out infinite,glitch 2.6s steps(1) infinite}
.foe-emo.f-wobble{animation:wobble 1.7s ease-in-out infinite}
.foe-emo.f-pulse{animation:pulse 1.1s ease-in-out infinite}
.foe-emo.f-sway{transform-origin:50% 90%;animation:sway 1.5s ease-in-out infinite}
.badge{position:absolute;top:-4%;right:-8%;width:42px;height:42px;border-radius:50%;background:var(--navy);border:3px solid var(--yellow);display:grid;place-items:center;font-size:22px;line-height:1;box-shadow:0 0 14px var(--yellow);z-index:3;animation:bob 1.6s ease-in-out infinite}
.badge:empty{display:none}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.proj{position:absolute;left:0;top:0;line-height:1;will-change:transform;filter:drop-shadow(0 0 10px #fff)}
.pop{position:absolute;font:400 30px/1 var(--arc);white-space:nowrap;letter-spacing:.01em;paint-order:stroke fill}
.pop.dmg{color:var(--yellow);-webkit-text-stroke:7px #B3001E;text-shadow:0 0 18px #FF8A00}
.pop.hurt{color:var(--red);-webkit-text-stroke:7px #FFF3A3;text-shadow:0 0 18px var(--red)}
.pop.heal{color:var(--green);-webkit-text-stroke:7px #06421F;text-shadow:0 0 16px var(--green)}
.pop.blk{font-size:20px;color:#fff;-webkit-text-stroke:6px #5B23B8;text-shadow:0 0 14px var(--purple)}
.banner{position:absolute;left:50%;top:40%;font:400 clamp(24px,7vw,40px)/1 var(--arc);color:var(--yellow);-webkit-text-stroke:8px #B3001E;paint-order:stroke fill;text-shadow:0 0 28px #FF8A00;white-space:nowrap}
.spark{position:absolute;left:0;top:0;line-height:1}
.ring{position:absolute;left:0;top:0;width:60px;height:60px;border-radius:50%;border:5px solid var(--yellow);box-shadow:0 0 18px var(--yellow),inset 0 0 12px var(--yellow)}
#flash{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0}

/* ---------- panel ---------- */
.panel{background:linear-gradient(#1D0F5C,#120A3C);border:3px solid var(--violet);border-radius:26px;box-shadow:0 0 28px rgba(123,61,255,.55),0 6px 0 #05021A;padding:14px;display:flex;flex-direction:column;gap:14px}
.panel.locked{pointer-events:none}
.mission{background:rgba(255,228,77,.09);border:3px solid var(--yellow);border-radius:18px;padding:10px 14px 12px;box-shadow:0 0 14px rgba(255,228,77,.3)}
.m-tag{display:inline-block;background:var(--yellow);color:var(--navy);border-radius:8px;padding:4px 10px;font:400 12px/1.1 var(--arc);letter-spacing:.08em;margin-bottom:7px}
.mission p{margin:0;font-size:clamp(16px,3.6vw,19px);font-weight:800;text-wrap:pretty}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot.solo{grid-column:1/-1}
.slot-l{display:flex;align-items:center;gap:7px;font:900 11px/1.1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--blue)}
.slot-l i{flex:none;font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--navy);display:grid;place-items:center;font:400 12px/1 var(--arc)}
.sbox{width:100%;min-height:64px;border:3px dashed #7A5FE8;border-radius:16px;background:#080320;box-shadow:inset 0 4px 14px rgba(0,0,0,.7);padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font:800 16px/1.15 var(--body);cursor:pointer;color:var(--muted)}
.sbox:hover{border-color:var(--blue);color:#fff}
.sbox.active{border-color:var(--green);color:var(--green);background:#062016;animation:slotpulse 1.1s ease-in-out infinite}
.sbox.hinted{border-color:var(--pink);color:var(--pink);background:#2A0722}
.sbox.filled{border-style:solid}
.sbox.snap{animation:snap .35s cubic-bezier(.2,1.7,.4,1)}
.sbox .e{font-size:22px;line-height:1}
.sbox.pc{box-shadow:0 5px 0 var(--cd),0 0 20px var(--c);transition:filter .15s}
.sbox.pc:hover{filter:hue-rotate(-40deg) brightness(1.12) saturate(1.2);color:var(--navy)}

/* puzzle pieces / arcade buttons */
.pc{--ct:#9AF3FF;--c:#22D3FF;--cd:#0A7F9E;color:var(--navy);
  background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0) 55%) top/100% 55% no-repeat,linear-gradient(var(--ct),var(--c) 65%);
  border:3px solid var(--cd)}
.k0{--ct:#9AF3FF;--c:#22D3FF;--cd:#0A7F9E}
.k1{--ct:#D9BCFF;--c:#A66BFF;--cd:#5B23B8}
.k2{--ct:#B9FFD5;--c:#39FF88;--cd:#12904A}
.k3{--ct:#FFB6F0;--c:#FF56D9;--cd:#A3168B}
.k4{--ct:#FFF3A3;--c:#FFE44D;--cd:#B39600}
.k5{--ct:#FFCBA0;--c:#FF8A3D;--cd:#B34A0A}
.hear{display:none}
.bank-h{font:900 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:-4px}
.bank{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:center;padding:4px 10px 6px}
.blk{position:relative;display:inline-flex;align-items:center;gap:7px;padding:11px 15px;border-radius:14px;font:900 16px/1.1 var(--body);cursor:pointer;touch-action:manipulation;
  box-shadow:0 5px 0 var(--cd),0 0 14px rgba(255,255,255,.08);transition:transform .1s,filter .15s,box-shadow .15s}
.blk>*{position:relative}
.blk::after{content:"";position:absolute;right:-12px;top:50%;width:21px;height:21px;transform:translateY(-50%);border-radius:50%;box-sizing:border-box;background:var(--c);border:3px solid var(--cd);border-left-color:var(--c)}
.blk::before{content:"";position:absolute;left:-12px;top:50%;width:21px;height:21px;transform:translateY(-50%);border-radius:50%;box-sizing:border-box;background:#160B47;border:3px solid var(--cd);border-right-color:#160B47;z-index:1}
.blk .e{font-size:21px;line-height:1}
.blk .tag{font:400 9px/1 var(--arc);letter-spacing:.06em;text-transform:uppercase;background:var(--navy);color:var(--yellow);border-radius:6px;padding:3px 5px}
.blk.solo{border-style:dashed}
.blk:hover:not(.used){filter:hue-rotate(-40deg) brightness(1.12) saturate(1.25);transform:translateY(-3px) rotate(-1.5deg);box-shadow:0 8px 0 var(--cd),0 0 26px var(--c)}
.blk:active:not(.used){transform:translateY(5px);box-shadow:0 0 0 var(--cd),0 0 12px var(--c)}
.blk.used{background:transparent!important;border:3px dashed #5B47C0;box-shadow:none;opacity:.4;cursor:default}
.blk.used::before,.blk.used::after{display:none}
.blk.used>*{visibility:hidden}
.blk.glow{animation:glow .8s ease-in-out infinite}

  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

<div class="wrap" id="app"></div>

<script>
(function(){
'use strict';
/* ================= helpers ================= */
var $=function(s,r){return (r||document).querySelector(s)};
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var wait=function(ms){return new Promise(function(r){setTimeout(r,RM?Math.min(ms,120):ms)})};
var rnd=function(a,b){return a+Math.random()*(b-a)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var app=$('#app'),ovRoot=$('#ov-root');

/* ================= sound ================= */
var AC=null,muted=false;
function tone(f,d,type,v,t0,f2){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    var t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
var sfx={
  click:function(){tone(520,.08,'triangle',.06)},
  type:function(){tone(900+Math.random()*200,.03,'square',.015)},
  place:function(){tone(620,.1,'triangle',.08,0,900)},
  remove:function(){tone(460,.09,'triangle',.06,0,300)},
  send:function(){tone(400,.25,'sawtooth',.05,0,1500)},
  zap:function(){tone(300,.35,'sawtooth',.04,0,1300)},
  hit:function(){tone(220,.22,'square',.07,0,70)},
  perfect:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.2,'triangle',.08,i*.09)})},
  block:function(){tone(170,.3,'square',.05,0,90)},
  hurt:function(){tone(280,.3,'sawtooth',.05,0,90)},
  tip:function(){tone(880,.12,'sine',.07);tone(1175,.16,'sine',.07,.1)},
  win:function(){[523,659,784,659,784,1047].forEach(function(f,i){tone(f,.22,'triangle',.09,i*.11)})},
  lose:function(){[392,330,262].forEach(function(f,i){tone(f,.35,'sine',.08,i*.22)})}
};

/* ================= progress ================= */
var KEY='promptFighterV2';
var FREE_LEVELS=15; // levels 1..FREE_LEVELS unlock for free by playing; the rest need prog.premium
var PRICE='$4.99'; // shown on the paywall card; update to match your App Store Connect price
function loadProg(){try{var j=JSON.parse(localStorage.getItem(KEY));if(j&&j.unlocked)return j}catch(e){}return{unlocked:1,stars:{},premium:false}}
var prog=loadProg();
// the native iOS app fires this once, on launch, if RevenueCat already
// knows the player owns the pack (a restore, a reinstall, family sharing…)
window.addEventListener('pf-already-premium',function(){
  if(!prog.premium){prog.premium=true;saveProg();if(S===null)try{showSelect()}catch(e){}}
});
function fixProg(){for(var k in prog.stars){if(prog.stars[k])prog.unlocked=Math.max(prog.unlocked,+k+1)}prog.unlocked=Math.min(prog.unlocked,LEVELS.length)}
function saveProg(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
function isPremiumLevel(n){return n>FREE_LEVELS}
function isLocked(n){
  if(n>prog.unlocked)return 'progress'; // haven't beaten the level before it yet
  if(isPremiumLevel(n)&&!prog.premium)return 'premium'; // behind the Prompt Master Pack
  return null;
}
/* ---- purchase bridge ----
   On the web/artifact/PWA this stays a harmless demo so you can preview the
   paywall. Inside the native iOS app (Capacitor), define window.PFPurchase
   and window.PFRestore before this script runs (see the iOS project's
   www/index.html) and they'll be used instead automatically. */
function tryUnlockPremium(){
  sfx.click();
  if(window.PFPurchase){
    ovRoot.querySelectorAll('[data-o=buy]').forEach(function(b){b.disabled=true;b.textContent='Talking to the App Store…'});
    window.PFPurchase().then(function(ok){
      if(ok){prog.premium=true;saveProg();closeOv();showSelect()}
      else showSelect();
    }).catch(function(){showSelect()});
    return;
  }
  showPaywall();
}
function tryRestorePremium(){
  sfx.click();
  if(window.PFRestore){
    window.PFRestore().then(function(ok){if(ok){prog.premium=true;saveProg();closeOv();showSelect()}else closeOv()}).catch(function(){closeOv()});
  }else closeOv();
}
function showPaywall(){
  var demo=/[?&]demo=1/.test(location.search),native=!!window.PFPurchase;
  ovRoot.innerHTML='<div class="ov"><div class="modal" role="dialog" aria-modal="true">'+
    '<div class="big-emo">🔓</div><h3>Prompt Master Pack</h3>'+

    (native?'':'<div class="skill"><b>🍏 This unlocks in the iPhone/iPad app</b><small>Purchases only work inside the App Store version of Prompt Fighter, not on this preview.</small></div>')+

/* ---- parental gate ----
   Apple's Kids Category rules require any purchase button to sit behind a
   gate a young child can't casually get past. A quick grown-up-level math
   question does the job; onPass() runs only after a correct answer. */
function showParentGate(onPass,msg){
  var a=2+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*8),correct=a*b;
  var opts=[correct];
  while(opts.length<4){
    var d=correct+(Math.floor(Math.random()*11)-5);
    if(d>0&&opts.indexOf(d)<0)opts.push(d);
  }
  opts=shuffle(opts);
  ovRoot.innerHTML='<div class="ov"><div class="modal" role="dialog" aria-modal="true">'+
    '<div class="big-emo">🧑‍👧</div><h3>Grown-Ups Only</h3>'+
    '<p><b>This step needs a parent or guardian.</b> Solve this to continue:</p>'+
    '<div class="skill"><b style="font-size:26px">'+a+' × '+b+' = ?</b></div>'+
    '<div class="mbtns gate-grid">'+opts.map(function(n){return '<button class="btn go" data-n="'+n+'">'+n+'</button>'}).join('')+'</div>'+
    (msg?'<p class="gate-msg">'+msg+'</p>':'')+
    '<div class="mbtns"><button class="btn" data-o="cancel">Cancel</button></div></div></div>';
  ovRoot.querySelectorAll('[data-n]').forEach(function(b){
    b.onclick=function(){
      sfx.click();
      if(+b.dataset.n===correct){closeOv();onPass()}
      else showParentGate(onPass,'Not quite — try again.');
    };
  });
  $('[data-o=cancel]',ovRoot).onclick=function(){sfx.click();showPaywall()};
  var f=ovRoot.querySelector('.btn.go');f&&f.focus({preventScroll:true});
}

  if(!PV.t&&PV.shown!==PV.target)PV.t=setInterval(pvTick,24);
}
function pvTick(){
  if(PV.shown===PV.target){clearInterval(PV.t);PV.t=null;return}
  if(PV.target.indexOf(PV.shown)===0){
    PV.shown=PV.target.slice(0,PV.shown.length+1);
    if(PV.shown.length%2===0)sfx.type();
  }else PV.shown=PV.shown.slice(0,-2);

}

/* ---- AI tip sheet ---- */
function showTip(){
  var ev=S.ev,L=S.L,ch=S.cur;
  var tip=ev.tier==='perfect'?ch.ok:(ev.tier==='good'?L.part:L.weak);
  var chips=[];
  if(ev.dmg>0)chips.push('<span class="chip">💥 -'+ev.dmg+' HP '+L.name+'</span>');
  else chips.push('<span class="chip">🛡️ 0 damage</span>');
  if(ev.cnt>0)chips.push('<span class="chip">💔 -'+ev.cnt+' HP Beep</span>');
  if(ev.heal>0)chips.push('<span class="chip">💚 +'+ev.heal+' HP Beep</span>');
  var notes=ev.notes.map(function(n){
    var lab=SL[n.k]?SL[n.k].label:'';
    if(n.state==='solo')return '<li class="b"><span class="ic">⚠️</span><div><b>“'+n.b.text+'”</b> — '+n.b.why+'</div></li>';
    if(n.state==='missing')return '<li class="b"><span class="ic">⬜</span><div><b>“'+lab+'” was empty.</b> Missing details make a prompt fuzzy!</div></li>';
    if(n.state==='mixed')return '<li class="b"><span class="ic">🔀</span><div><b>“'+n.b.text+'”</b> is in the wrong spot. It belongs in “'+SL[n.b.k].label+'”. Order matters!</div></li>';
    var c=n.state==='great'?'g':n.state==='okay'?'o':'b',ic=n.state==='great'?'✅':n.state==='okay'?'👍':'⚠️';
    return '<li class="'+c+'"><span class="ic">'+ic+'</span><div><b>'+n.b.text+'</b> — '+n.b.why+'</div></li>';
  }).join('');
  var best=ch.slots.map(function(k){return S.bank.find(function(b){return b.k===k&&b.q===2}).text}).join(' ');
  var btn=S.ehp<=0?'Victory! ▶':S.php<=0?'Oh no… ▶':'Next round ▶';
  ovRoot.innerHTML='<div class="tipwrap"><div class="tipsheet t-'+ev.tier+'" role="dialog" aria-label="AI Tip">'+
   '<div class="ts-top"><h2>'+TIERS[ev.tier]+'</h2><div class="chips">'+chips.join('')+'</div></div>'+
   '<div class="ts-tip"><div class="ts-bot">'+robot()+'</div><div><span class="ts-badge">💡 AI TIP</span><p>'+tip+'</p></div></div>'+
   '<p class="ts-said">You said: <b>“'+ev.sentence+'!”</b>'+(ev.tier!=='perfect'?'<br>Super prompt: <b>“'+best+'!”</b>':'')+'</p>'+
   '<details class="more"><summary>See block by block</summary><ul class="notes">'+notes+'</ul></details>'+
   '<button class="btn go" data-o="next">'+btn+'</button></div></div>';
  var b=$('[data-o=next]',ovRoot);b.onclick=function(){closeOv();afterRound()};b.focus({preventScroll:true});
  sfx.tip();
}

/* ---- input handlers ---- */
function nextEmpty(){return S.slots.findIndex(function(x){return x==null})}
function onPanel(e){
  var t=e.target.closest('[data-a]');
  if(!t||t.disabled||!S||S.phase!=='build')return;
  var a=t.dataset.a;
  if(a==='blk')place(+t.dataset.id);
  else if(a==='slot')slotClick(+t.dataset.i);
  else if(a==='clr'){S.slots=S.slots.map(function(){return null});S.solo=null;S.active=0;S.glow=null;sfx.remove();renderPanel()}
  else if(a==='hint')useHint();
  else if(a==='send')send();
}
function place(id){
  var b=bk(id);
  if(b.solo){
    if(S.solo===id)return;
    S.slots=S.slots.map(function(){return null});S.solo=id;S.active=-1;S.glow=null;
    sfx.place();renderPanel();return;
  }
  if(S.slots.indexOf(id)>=0)return;
  if(S.solo!=null){S.solo=null;S.active=0}
  var i=(S.active>=0&&S.slots[S.active]==null)?S.active:nextEmpty();
  if(i<0)return;
  S.slots[i]=id;S.active=nextEmpty();S.snap=i;
  if(S.glow===id)S.glow=null;
  sfx.place();renderPanel();
}
function slotClick(i){
  if(i<0){S.solo=null;S.active=0;sfx.remove()}
  else if(S.slots[i]!=null){S.slots[i]=null;S.active=i;sfx.remove()}
  else{S.active=i;sfx.click()}
  renderPanel();
}
function useHint(){
  if(S.hints<=0)return;
  S.hints--;S.tip=true;sfx.click();
  var keys=S.cur.slots,i=-1;
  if(S.solo!=null)i=0;
  else for(var j=0;j<keys.length;j++){
    var b=S.slots[j]==null?null:bk(S.slots[j]);
    if(!b||b.k!==keys[j]||b.q<2){i=j;break}
  }
  S.hintSlot=i;
  if(i>=0){var best=S.bank.find(function(b){return b.k===keys[i]&&b.q===2});S.glow=best.id}else S.glow=null;
  renderPanel();
}

/* ---- evaluate & fight ---- */
function send(){
  var L=S.L,ev,filled;
  if(S.solo!=null){
    var sb=bk(S.solo);
    filled=[sb];
    ev={tier:'weak',solo:true,notes:[{state:'solo',b:sb,k:'do'}],sentence:sb.text};
  }else{
    filled=S.slots.map(function(id){return id==null?null:bk(id)});
    if(!filled.some(Boolean))return;
    var notes=[],score=0;
    S.cur.slots.forEach(function(k,i){
      var b=filled[i];
      if(!b)notes.push({state:'missing',k:k});
      else if(b.k!==k)notes.push({state:'mixed',k:k,b:b});
      else{score+=b.q;notes.push({state:['vague','okay','great'][b.q],k:k,b:b})}
    });
    var pct=score/(S.cur.slots.length*2);
    var tier=pct>=1?'perfect':pct>=.66?'good':pct>=.3?'weak':'blocked';
    ev={tier:tier,notes:notes,sentence:filled.filter(Boolean).map(function(b){return b.text}).join(' ')};
  }
  ev.dmg=L.dmg[ev.tier];ev.cnt=L.cnt[ev.tier];ev.heal=ev.tier==='perfect'?L.heal:0;
  PV.target=ev.sentence;PV.shown=ev.sentence;if(PV.t){clearInterval(PV.t);PV.t=null}
  resolve(ev,filled);
}

function center(el){
  var a=$('#arena').getBoundingClientRect(),r=el.getBoundingClientRect();
  return {x:r.left-a.left+r.width/2,y:r.top-a.top+r.height/2};
}
function T(x,y,s,r){return 'translate('+x+'px,'+y+'px) translate(-50%,-50%) scale('+s+') rotate('+r+'deg)'}
function fly(emoji,from,to,o){
  o=o||{};
  var e=document.createElement('div');
  e.className='proj';e.textContent=emoji;e.style.fontSize=(o.size||44)+'px';
  $('#fx').appendChild(e);
  var spin=RM?0:(o.spin==null?360:o.spin),dur=RM?200:(o.dur||700);
  var midY=Math.min(from.y,to.y)-(o.arc==null?36:o.arc);
  var an=e.animate([
    {transform:T(from.x,from.y,.6,0)},
    {transform:T((from.x+to.x)/2,midY,1.2,spin/2)},
    {transform:T(to.x,to.y,1,spin)}
  ],{duration:dur,easing:'ease-in',fill:'forwards'});
  return an.finished.then(function(){return e},function(){return e});
}
/* floating combat text: "-20 HP" pops, wobbles and drifts up */
function popup(txt,pt,cls,size){
  var e=document.createElement('div');e.className='pop '+(cls||'');e.textContent=txt;
  if(size)e.style.fontSize=size+'px';

    {transform:'translate(-50%,-26px) scale(1) rotate('+r/2+'deg)',opacity:1,offset:.32},
    {transform:'translate(-50%,-64px) scale(1.05) rotate('+(-r/2)+'deg)',opacity:1,offset:.78},
    {transform:'translate(-50%,-92px) scale(.9) rotate(0deg)',opacity:0}
  ],{duration:RM?300:1400,easing:'ease-out'});

}
function banner(txt){
  var e=document.createElement('div');e.className='banner';e.textContent=txt;$('#fx').appendChild(e);
  var an=e.animate([
    {transform:'translate(-50%,-50%) scale(.3) rotate(-14deg)',opacity:0},

    {transform:'translate(-50%,-50%) scale(1) rotate(-6deg)',opacity:1,offset:.8},

  ],{duration:RM?300:1300});

function burst(pt,list,n,dist){
  if(RM)return;
  for(var i=0;i<n;i++){
    var e=document.createElement('div');e.className='spark';e.textContent=list[i%list.length];
    e.style.fontSize=rnd(16,28)+'px';$('#fx').appendChild(e);
    var ang=rnd(0,Math.PI*2),d=rnd(dist*.5,dist);

      {transform:'translate('+pt.x+'px,'+pt.y+'px) translate(-50%,-50%) scale(.4)',opacity:1},
      {transform:'translate('+(pt.x+Math.cos(ang)*d)+'px,'+(pt.y+Math.sin(ang)*d)+'px) translate(-50%,-50%) scale(1.2) rotate('+rnd(-90,90)+'deg)',opacity:0}
    ],{duration:rnd(500,850),easing:'ease-out'});
    (function(el){an.finished.then(function(){el.remove()},function(){el.remove()})})(e);
  }
}
function ring(pt,color){
  if(RM)return;
  var e=document.createElement('div');e.className='ring';if(color){e.style.borderColor=color;e.style.boxShadow='0 0 18px '+color+',inset 0 0 12px '+color}
  $('#fx').appendChild(e);
  e.animate([
    {transform:'translate('+pt.x+'px,'+pt.y+'px) translate(-50%,-50%) scale(.2)',opacity:1},
    {transform:'translate('+pt.x+'px,'+pt.y+'px) translate(-50%,-50%) scale(2.6)',opacity:0}
  ],{duration:520,easing:'ease-out'}).finished.then(function(){e.remove()},function(){e.remove()});
}
function shake(el,mag){
  if(RM)return;
  el.animate([
    {transform:'translateX(0)',filter:'none'},
    {transform:'translateX(-'+mag+'px)',filter:'brightness(2)'},
    {transform:'translateX('+mag*.9+'px)'},
    {transform:'translateX(-'+mag*.6+'px)',filter:'brightness(1.5)'},
    {transform:'translateX(0)',filter:'none'}
  ],{duration:450});
}
/* whole-screen shake + colored flash */
function screenShake(mag,ms){
  if(RM)return;
  var el=$('.wrap'),kf=[],n=9;
  for(var i=0;i<n;i++){var f=1-i/n;kf.push({transform:'translate('+rnd(-mag,mag)*f+'px,'+rnd(-mag,mag)*f+'px) rotate('+rnd(-mag/8,mag/8)*f+'deg)'})}
  kf.push({transform:'none'});
  el.animate(kf,{duration:ms||420,easing:'linear'});
}
function flash(color,peak){
  if(RM)return;
  var f=$('#flash');
  f.style.background='radial-gradient(circle at 50% 40%,transparent 30%,'+color+' 100%)';
  f.animate([{opacity:0},{opacity:peak||.7,offset:.15},{opacity:0}],{duration:520,easing:'ease-out'});
}
function lunge(el,dx){
  if(RM)return;
  el.animate([
    {transform:'translateX(0) rotate(0)'},
    {transform:'translateX('+(-dx*.35)+'px) rotate('+(dx>0?-6:6)+'deg)',offset:.3},
    {transform:'translateX('+dx+'px) rotate('+(dx>0?6:-6)+'deg)',offset:.6},
    {transform:'translateX(0) rotate(0)'}
  ],{duration:520,easing:'ease-out'});

function setBar(id,numId,v,max){

function updateBars(){
  setBar('pfill','pnum',S.php,100);setBar('efill','enum',S.ehp,S.L.hp);
  if(S.L.blur){ // the ghost comes into focus as the player gets more precise

function sadFace(ms){

async function resolve(ev,filled){
  S.phase='anim';S.ev=ev;S.reply='';renderPanel();
  var L=S.L,hero=$('#hero'),foe=$('#foe'),emo=$('#foeEmo'),tier=ev.tier;
  var pe=(filled[L.pi]||filled.find(Boolean)).emoji;
  sfx.send();
  window.scrollTo({top:0,behavior:'smooth'});
  await wait(650);
  S.reply=ev.solo?REPLY.solo:REPLY[tier];renderPanel();
  await wait(350);
  // persona level: Beep puts on the chosen role's costume
  if(L.role&&filled[0]&&filled[0].k==='role'){
    var c=document.createElement('div');c.className='costume';c.textContent=filled[0].emoji;hero.appendChild(c);
    sfx.click();await wait(500);
  }
  sfx.zap();lunge(hero,36);
  await wait(260);
  var hp=center(hero),fp=center(emo);
  var pr=await fly(pe,{x:hp.x+34,y:hp.y-8},fp,{size:tier==='perfect'?64:46});
  pr.remove();
  if(ev.dmg===0){
    sfx.block();
    var sh=document.createElement('div');sh.className='spark';sh.textContent='🛡️';sh.style.fontSize='58px';
    $('#fx').appendChild(sh);
    sh.animate([{transform:T(fp.x,fp.y,.3,0),opacity:0},{transform:T(fp.x,fp.y,1.15,0),opacity:1,offset:.3},{transform:T(fp.x,fp.y,1,0),opacity:1,offset:.8},{transform:T(fp.x,fp.y,1,0),opacity:0}],{duration:900}).finished.then(function(){sh.remove()},function(){sh.remove()});
    popup('MISSED!',{x:fp.x,y:fp.y-58},'blk');
    screenShake(3,260);
    fly(pe,fp,{x:hp.x,y:hp.y-30},{size:38,arc:70,dur:600}).then(function(e){e.remove()});
    await wait(650);
  }else{
    sfx.hit();
    var big=tier==='perfect';
    burst(fp,['✨','⭐','💫'],big?16:8,big?100:60);
    ring(fp,big?'#FFE44D':'#FFFFFF');
    shake(foe,10);
    screenShake(big?13:tier==='good'?8:5,big?520:380);
    flash(big?'rgba(255,228,77,.9)':'rgba(255,255,255,.6)',big?.75:.4);
    S.ehp=Math.max(0,S.ehp-ev.dmg);updateBars();
    popup('-'+ev.dmg+' HP',{x:fp.x,y:fp.y-36},'dmg',26+ev.dmg*.75);
    if(big){
      sfx.perfect();banner('PERFECT!');
      var bd=$('#badge');
      if(bd.textContent)bd.animate([{transform:'scale(1)',opacity:1},{transform:'translate(20px,-40px) scale(1.6) rotate(40deg)',opacity:0}],{duration:600,fill:'forwards'});
      if(L.mimic)popup('COPY BLOCKED!',{x:fp.x,y:fp.y-86},'blk');
      if(ev.heal>0){
        await wait(450);
        S.php=Math.min(100,S.php+ev.heal);updateBars();
        popup('+'+ev.heal+' HP',{x:hp.x,y:hp.y-36},'heal',30);
        await wait(250);
      }
    }
    await wait(700);
  }
  if(S.ehp<=0){
    foe.animate([{transform:'none',opacity:1},{transform:'translateY(34px) rotate(28deg) scale(.8)',opacity:0}],{duration:RM?200:900,fill:'forwards'});
    burst(fp,['💫','⭐','✨'],18,120);
    await wait(600);
  }else if(ev.cnt>0){
    var atk=L.atk;
    if(L.mimic){ // no guardrail: the Mimic steals your move!
      atk=pe;
      popup('COPIED!',{x:fp.x,y:fp.y-70},'blk');
      if(!RM)emo.animate([{transform:'scaleX(1)'},{transform:'scaleX(-1)'},{transform:'scaleX(1)'}],{duration:500});
      await wait(450);
    }
    lunge(foe,-46);sfx.hurt();
    await wait(300);
    var pr2=await fly(atk,{x:fp.x-30,y:fp.y},{x:hp.x,y:hp.y-10},{size:46,arc:20,dur:600});
    pr2.remove();
    S.php=Math.max(0,S.php-ev.cnt);updateBars();
    shake(hero,9);sadFace(1200);
    screenShake(11,480);flash('rgba(255,61,90,.95)',.8);
    burst({x:hp.x,y:hp.y-10},['💢','💥'],6,50);
    ring({x:hp.x,y:hp.y-10},'#FF3D5A');
    popup('-'+ev.cnt+' HP',{x:hp.x,y:hp.y-36},'hurt',26+ev.cnt*.9);
    await wait(700);
    if(S.php<=0){
      hero.animate([{transform:'none',opacity:1},{transform:'translateY(30px) rotate(-30deg)',opacity:0}],{duration:RM?200:800,fill:'forwards'});
      await wait(500);
    }
  }
  S.phase='coach';renderPanel();showTip();
}
function afterRound(){
  if(S.ehp<=0)return win();
  if(S.php<=0)return lose();
  sfx.click();newRound();
}

/* ================= overlays ================= */
function closeOv(){ovRoot.innerHTML='';document.querySelectorAll('.conf').forEach(function(c){c.remove()})}
function confetti(){
  if(RM)return;
  var cols=['#FFE44D','#FF3D5A','#39FF88','#22D3FF','#B57BFF','#FF4FD8'];
  for(var i=0;i<50;i++){
    var c=document.createElement('div');c.className='conf';
    c.style.left=rnd(0,100)+'vw';c.style.background=cols[i%cols.length];
    c.style.animationDelay=rnd(0,1.2)+'s';c.style.animationDuration=rnd(2.4,4)+'s';
    document.body.appendChild(c);
    setTimeout((function(el){return function(){el.remove()}})(c),5500);
  }
}
function win(){
  sfx.win();
  var st=S.round<=4?3:S.round<=6?2:1;
  prog.stars[S.n]=Math.max(prog.stars[S.n]||0,st);
  prog.unlocked=Math.max(prog.unlocked,Math.min(LEVELS.length,S.n+1));
  saveProg();
  var last=S.n===LEVELS.length,L=S.L,body;
  var rd=S.round+' round'+(S.round>1?'s':'');
  if(last){
    body='<h2>PROMPT MASTER!</h2><div class="rob">'+robot()+'</div>'+
      '<p><b>You beat '+L.name+' '+L.emoji+' in '+rd+' and learned all '+LEVELS.length+' real AI skills!</b></p>'+
      '<ul class="recap">'+LEVELS.map(function(l){return '<li>'+l.emoji+' <b>'+l.skill+'</b><small>'+l.lesson+'</small></li>'}).join('')+'</ul>'+
      '<div class="stars">'+stars(st)+'</div>'+
      '<div class="mbtns"><button class="btn go big" data-o="select">Choose a level</button><button class="btn" data-o="replay">↺ Replay</button></div>';
  }else{
    var milestone=(S.n===FREE_LEVELS&&!prog.premium);
    body='<h2>VICTORY!</h2><div class="rob">'+robot()+'</div>'+
      '<p><b>You beat '+L.name+' '+L.emoji+' in '+rd+'!</b></p>'+
      '<div class="stars">'+stars(st)+'</div>'+
      '<div class="skill"><b>🎓 AI skill unlocked: '+L.skill+'</b><small>'+L.lesson+'</small></div>'+
      (milestone?'<div class="skill"><b>🎉 You finished the free adventure!</b><small>10 more monsters are waiting in the Prompt Master Pack.</small></div>':'')+
      '<div class="mbtns"><button class="btn go big" data-o="next">'+(milestone?'🔓 Get the Pack ▶':'Next level ▶')+'</button><button class="btn" data-o="replay">↺ Replay</button><button class="btn" data-o="select">Levels</button></div>';
  }
  ovRoot.innerHTML='<div class="ov"><div class="modal win" role="dialog" aria-modal="true">'+body+'</div></div>';
  confetti();wireOv();
}
function lose(){
  sfx.lose();
  ovRoot.innerHTML='<div class="ov"><div class="modal lose" role="dialog" aria-modal="true">'+
    '<h2>TRY AGAIN!</h2><div class="rob sad">'+robot()+'</div>'+
    '<p><b>Beep needs to recharge 🔋 You’re getting better every round!</b></p>'+
    '<div class="skill"><b>💡 Remember: '+S.L.skill+'</b><small>'+S.L.lesson+'</small></div>'+
    '<div class="mbtns"><button class="btn hot big" data-o="replay">↺ Try Again!</button><button class="btn" data-o="select">Levels</button></div></div></div>';
  wireOv();
}
function wireOv(){
  ovRoot.querySelectorAll('[data-o]').forEach(function(b){
    b.onclick=function(){
      var o=b.dataset.o;sfx.click();
      if(o==='next'){
        var nx=S.n+1;
        if(isLocked(nx)==='premium')showPaywall();
        else startLevel(nx);
      }
      else if(o==='replay')startLevel(S.n);
      else showSelect();
    };
  });
  var f=ovRoot.querySelector('.btn.big');f&&f.focus({preventScroll:true});
}

// keep the game feeling like an app: no pinch-zoom (double-tap zoom is off via touch-action)
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
// offline support (only works when served over https)
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
showTitle();
})();
</script>
<script>
/* ===================================================================
   iOS PURCHASE BRIDGE — RevenueCat
   Only runs inside the native app (Capacitor); harmless everywhere else.
   Fill in REVENUECAT_API_KEY and ENTITLEMENT_ID below (see README.md
   "Set up RevenueCat" section) before your first real Codemagic build.
   =================================================================== */
(function(){
  var REVENUECAT_API_KEY = 'appl_mbtydkPyoBnHqKFVfwKtNPzxmE'; // RevenueCat dashboard → Project → API keys → Apple App Store
  var ENTITLEMENT_ID = 'premium'; // must match the entitlement you create in RevenueCat

  function boot(){
    if(!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform())return;
    var Purchases = window.Capacitor.Plugins && window.Capacitor.Plugins.Purchases;
    if(!Purchases){console.warn('[Prompt Fighter] RevenueCat plugin not found — did you npm install @revenuecat/purchases-capacitor and npx cap sync?');return}

    function owns(info){return !!(info&&info.entitlements&&info.entitlements.active&&info.entitlements.active[ENTITLEMENT_ID])}

    Purchases.configure({apiKey:REVENUECAT_API_KEY}).catch(function(e){console.warn('[Prompt Fighter] RevenueCat configure failed',e)});

    // on launch, silently check if this device/Apple ID already owns the pack
    Purchases.getCustomerInfo().then(function(r){
      if(owns(r&&r.customerInfo))window.dispatchEvent(new CustomEvent('pf-already-premium'));
    }).catch(function(){});

    window.PFPurchase=function(){
      return Purchases.getOfferings().then(function(res){
        var pkg=res&&res.offerings&&res.offerings.current&&res.offerings.current.availablePackages&&res.offerings.current.availablePackages[0];
        if(!pkg)throw new Error('No RevenueCat package configured — set up an Offering in the RevenueCat dashboard first.');
        return Purchases.purchasePackage({aPackage:pkg});
      }).then(function(r){return owns(r&&r.customerInfo)})
        .catch(function(e){
          // a cancelled purchase should fail quietly, not show an error
          if(e&&(e.userCancelled||/cancel/i.test(e.message||'')))return false;
          throw e;
        });
    };
    window.PFRestore=function(){
      return Purchases.restorePurchases().then(function(r){return owns(r&&r.customerInfo)});
    };
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
